name: Go Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -count=1 -tags=unit ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: strykz_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go test -count=1 -tags=integration ./...
        env:
          POSTGRES_URL: postgres://postgres:test@localhost:5432/strykz_test
          REDIS_ADDRESS: localhost:6379

  e2e-test:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      
      - name: Build and Start Full Stack (DBs, Backend, CSS + Sidecar)
        # This will download the CSS server via SteamCMD (takes ~3-4 mins on GitHub's fast network)
        # and boot up the entire docker-compose network.
        run: docker compose up -d --build

      - name: Verify Sidecar connects to Backend
        run: |
          echo "Waiting for CSS Server and Sidecar to boot..."
          # The timeout ensures the CI doesn't hang forever if something breaks
          timeout 300 bash -c 'until docker compose logs backend | grep -q "server local-test-server-1 started"; do echo "waiting..."; sleep 5; done'
          echo "✅ Sidecar successfully connected to Backend!"

      - name: Verify Heartbeat
        run: |
          echo "Waiting for first heartbeat..."
          timeout 30 bash -c 'until docker compose logs backend | grep -q "heartbeat from local-test-server-1"; do echo "waiting..."; sleep 2; done'
          echo "✅ Sidecar heartbeat received!"

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs
